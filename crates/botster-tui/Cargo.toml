[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "549b3f62dabacf45cce4b4dfd19e1a6800bf8c7a", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "549b3f62dabacf45cce4b4dfd19e1a6800bf8c7a", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "549b3f62dabacf45cce4b4dfd19e1a6800bf8c7a" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "1ec61b94c76f62b0b2942c21c7c03630da709221" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "6c4691036f68c870d8003b2927d4c22ac052c081" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "549b3f62dabacf45cce4b4dfd19e1a6800bf8c7a", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "1ec61b94c76f62b0b2942c21c7c03630da709221" }
jsonschema = { version = "0.49.2", default-features = false }
# Process signals and exit waits (kqueue on macOS, pidfd on Linux) in the live tests.
rustix = { version = "1.1.4", features = ["event", "process"] }
# Real-PTY driver for the actual-client live tests (tests/live_tui.rs).
portable-pty = "0.9.0"
