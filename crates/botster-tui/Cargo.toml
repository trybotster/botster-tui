[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "a931125b027f5832845ae0365a8011d499f61ab6", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "a931125b027f5832845ae0365a8011d499f61ab6", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "a931125b027f5832845ae0365a8011d499f61ab6" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "384a5fc8a244a0b893df674ad4bd799d3b4f9d03" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "7940306b0d7461a12575b3856a96c0fbb23784f3" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "a931125b027f5832845ae0365a8011d499f61ab6", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "384a5fc8a244a0b893df674ad4bd799d3b4f9d03" }
jsonschema = { version = "0.49.2", default-features = false }
