[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "b9e989be3232c72e966ce3fdb63878c82b70d94d", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "b9e989be3232c72e966ce3fdb63878c82b70d94d", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "b9e989be3232c72e966ce3fdb63878c82b70d94d" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "b60ca68dcae7c8025d69784c9f77efdb9ea5a827" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "7940306b0d7461a12575b3856a96c0fbb23784f3" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "b9e989be3232c72e966ce3fdb63878c82b70d94d", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "b60ca68dcae7c8025d69784c9f77efdb9ea5a827" }
jsonschema = { version = "0.49.2", default-features = false }
# Real-PTY driver for the actual-client live tests (tests/live_tui.rs).
portable-pty = "0.9.0"
