[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "8fce2041b9fe742cb2a6df9e74cb262606672742", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "8fce2041b9fe742cb2a6df9e74cb262606672742", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "8fce2041b9fe742cb2a6df9e74cb262606672742" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "7a09292cd518186e0def758c823c0841ee1cacf1" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "c83ba6c518e2324e34ce24c7abe5a8a05e56293c" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.2" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "8fce2041b9fe742cb2a6df9e74cb262606672742", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "7a09292cd518186e0def758c823c0841ee1cacf1" }
jsonschema = { version = "0.49.2", default-features = false }
