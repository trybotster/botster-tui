[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "48a437032791e678010254708259568ce4ad02bf", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "48a437032791e678010254708259568ce4ad02bf", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "48a437032791e678010254708259568ce4ad02bf" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "bb1a330543bc06888f894edd5f40a0f867753a12" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "7940306b0d7461a12575b3856a96c0fbb23784f3" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "48a437032791e678010254708259568ce4ad02bf", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "bb1a330543bc06888f894edd5f40a0f867753a12" }
jsonschema = { version = "0.49.2", default-features = false }
