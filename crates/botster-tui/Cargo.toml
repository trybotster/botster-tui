[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "0ee42e9b84a0b0e9b0ab89834675535c8b831993" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "571523d93a62945208ebb2bb75262dcdd78001a2" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", rev = "0ee42e9b84a0b0e9b0ab89834675535c8b831993" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "0ee42e9b84a0b0e9b0ab89834675535c8b831993" }
jsonschema = { version = "0.49.2", default-features = false }
