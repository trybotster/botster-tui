[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "cb93df53d66fead323973b5233d4589562cf57b1" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "902650dfbd56a5bdc99c1e88c04ba2e62442f703" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", rev = "cb93df53d66fead323973b5233d4589562cf57b1" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "cb93df53d66fead323973b5233d4589562cf57b1" }
jsonschema = { version = "0.49.2", default-features = false }
