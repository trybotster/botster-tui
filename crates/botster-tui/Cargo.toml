[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "033cd01ca307e57fb9fd8c8b6deadb6d691ab45b", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "033cd01ca307e57fb9fd8c8b6deadb6d691ab45b", features = ["libghostty-vt"] }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "f9f0d8df997a1f59a7ac8d40cab1c06f363c5d7d" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "d2f809c75403e576022c42e512454a2a13a05586" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", rev = "f9f0d8df997a1f59a7ac8d40cab1c06f363c5d7d" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "033cd01ca307e57fb9fd8c8b6deadb6d691ab45b", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "f9f0d8df997a1f59a7ac8d40cab1c06f363c5d7d" }
jsonschema = { version = "0.49.2", default-features = false }
