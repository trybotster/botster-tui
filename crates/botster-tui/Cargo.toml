[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "7eafa470a18025895995bbedc20d34b58106a03b", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "7eafa470a18025895995bbedc20d34b58106a03b", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "7eafa470a18025895995bbedc20d34b58106a03b" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "b3b54f1f87e29867da4eb371e9b7f3b18160996a" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "c83ba6c518e2324e34ce24c7abe5a8a05e56293c" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.2" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "7eafa470a18025895995bbedc20d34b58106a03b", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "b3b54f1f87e29867da4eb371e9b7f3b18160996a" }
jsonschema = { version = "0.49.2", default-features = false }
