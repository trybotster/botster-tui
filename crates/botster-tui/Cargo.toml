[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "891e220295427fd93991638d7c62ba40fa25d4ae", default-features = false }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "891e220295427fd93991638d7c62ba40fa25d4ae", features = ["libghostty-vt"] }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "891e220295427fd93991638d7c62ba40fa25d4ae" }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "a69b70ccf5516489579647e21926b3aac7ea8b66" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "6c4691036f68c870d8003b2927d4c22ac052c081" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "891e220295427fd93991638d7c62ba40fa25d4ae", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "a69b70ccf5516489579647e21926b3aac7ea8b66" }
jsonschema = { version = "0.49.2", default-features = false }
# kill(2) and kqueue EVFILT_PROC exit waits in the live tests.
libc = "0.2"
# Real-PTY driver for the actual-client live tests (tests/live_tui.rs).
portable-pty = "0.9.0"
