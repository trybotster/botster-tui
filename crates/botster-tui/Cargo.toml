[package]
name = "botster-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-client = { git = "https://github.com/trybotster/botster-hub.git", rev = "e8febabf73259cfd922592346b244ec473c17323" }
botster-tui-kit = { git = "https://github.com/trybotster/botster-tui-kit.git", rev = "76e2085632f2da2f4423100cec85f23527373524" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", rev = "e8febabf73259cfd922592346b244ec473c17323" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "16bf08f29ec723c70c290cf995745ccbf79d4f05", default-features = false }
botster-hub-test-support = { git = "https://github.com/trybotster/botster-hub.git", rev = "e8febabf73259cfd922592346b244ec473c17323" }
jsonschema = { version = "0.49.2", default-features = false }
